[package]
name = "quickrelay-transport"
description = "QuickRelay data-plane transport: SO_REUSEPORT per-core workers, UDP send/recv, TCP listener, and the 16-bit length-prefix framing shared by TURN over TCP and ICE-TCP"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Dependencies are limited to socket2, mio, bytes, log (plus rustls / io-uring
# in later stages). quickrelay-protocol is allowed; quickrelay-binding is NOT.
# See docs/architecture/workspace-layout.md section 2.3.
[dependencies]
socket2 = { workspace = true }
# `mio` ships the socket wrappers behind the `net` feature and `Poll::new` /
# `Events::with_capacity` behind `os-poll`; the workspace line enables neither,
# so both are listed here. Features are additive, so the workspace entry stays.
mio = { workspace = true, features = ["net", "os-poll"] }
bytes = { workspace = true }

[dev-dependencies]
quickrelay-protocol = { workspace = true }
