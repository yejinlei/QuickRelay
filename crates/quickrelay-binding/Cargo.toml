[package]
name = "quickrelay-binding"
version = "0.1.0"
edition = "2021"
description = "STUN Binding full semantics, ICE candidate attribute validation, and ICE-TCP framing (YEJ-142)"
license = "MIT"

[dependencies]
# Deliberately empty. quickrelay-binding is a pure-logic crate with no I/O and
# no allocation on the hot path (see docs/architecture/tech-stack.md §1.1).
#
# It is intentionally independent of quickrelay-protocol (YEJ-140): the message
# codec is owned by that issue, and every input here is a plain value (flags,
# endpoints, tiebreaker), not a parsed STUN message. When 140 lands, the
# integration work is to map codec attributes onto `RequestFlags` /
# `IceRole` and to render `ResponseAttribute` into bytes in that order —
# no change to this crate's decisions is required.
#
# The RFC 4571 length framing in `ice_tcp` is the WebRTC ICE-TCP path, not a
# codec contract; RFC 6062's TURN-over-TCP control connection does not use it
# (see `ice_tcp` module docs).

[dev-dependencies]
socket2 = { version = "0.5", features = ["all"] }
